<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no, viewport-fit=cover">
    <title>Suraj Patel - Portfolio</title>
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />

    <!-- Preconnect to Google Fonts for faster loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Load fonts with display=swap to prevent FOIT -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

    <!-- Preload critical fonts -->
    <link rel="preload" as="style"
        href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">

    <link href="/dist/output.css" rel="stylesheet">

    <!-- Loader styles -->
    <style>
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #09090b;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.6s ease-out, transform 0.6s ease-out;
        }

        #loader.fade-out {
            opacity: 0;
            transform: scale(0.95);
        }

        .loader-logo {
            font-family: 'Press Start 2P', monospace;
            color: #a3e635;
            font-size: clamp(16px, 4vw, 32px);
            margin-bottom: 40px;
            text-align: center;
            animation: glitch 3s infinite;
            text-shadow:
                2px 2px 0 #e879f9,
                -2px -2px 0 #a3e635;
        }

        .progress-container {
            width: 80%;
            max-width: 400px;
            height: 4px;
            background: rgba(163, 230, 53, 0.1);
            border: 2px solid #a3e635;
            position: relative;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #a3e635 0%, #e879f9 100%);
            width: 0%;
            animation: loading 1.5s ease-in-out forwards;
            box-shadow: 0 0 20px rgba(163, 230, 53, 0.5);
        }

        .loading-text {
            font-family: 'VT323', monospace;
            color: #a3e635;
            font-size: 18px;
            margin-top: 20px;
            letter-spacing: 2px;
        }

        .loading-dots::after {
            content: '';
            animation: dots 1.5s infinite;
        }

        @keyframes loading {
            0% {
                width: 0%;
            }

            100% {
                width: 100%;
            }
        }

        @keyframes dots {

            0%,
            20% {
                content: '';
            }

            40% {
                content: '.';
            }

            60% {
                content: '..';
            }

            80%,
            100% {
                content: '...';
            }
        }

        @keyframes glitch {

            0%,
            90%,
            100% {
                text-shadow:
                    2px 2px 0 #e879f9,
                    -2px -2px 0 #a3e635;
            }

            92%,
            96% {
                text-shadow:
                    -2px 2px 0 #e879f9,
                    2px -2px 0 #a3e635;
            }
        }

        /* Scanline effect */
        .loader-scanline {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom,
                    transparent 50%,
                    rgba(0, 0, 0, 0.3) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            animation: scan 8s linear infinite;
        }

        @keyframes scan {
            0% {
                background-position: 0 0;
            }

            100% {
                background-position: 0 100%;
            }
        }
    </style>
</head>

<body class="bg-gray-100">
    <!-- Loader -->
    <div id="loader">
        <div class="loader-scanline"></div>
        <div class="loader-logo">SURAJ.EXE</div>
        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>
        <div class="loading-text">
            <span class="loading-dots">LOADING</span>
        </div>
    </div>

    <div id="root"></div>

    <script>
        // Remove loader after content loads
        window.addEventListener('load', () => {
            setTimeout(() => {
                const loader = document.getElementById('loader');
                loader.classList.add('fade-out');
                setTimeout(() => {
                    loader.style.display = 'none';
                }, 600);
            }, 1500);
        });
    </script>
</body>

</html>
